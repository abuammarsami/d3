schema_version: '1.1'
name: capture-incident-action-items
description: An incident routes to docs/reference/incidents/, is written blamelessly, and has an Action items table
  with an Owner column; unknown owners are asked for, not invented.
tags:
- capture
- incident
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: 'Capture this incident: yesterday 14:05–14:50 checkout returned 500s for all users because Sam deployed
    a config with the payment API key missing. We rolled back. Use /d3:capture --incident if available.'
  max_turns: 30
  timeout_seconds: 300
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
graders:
- name: criteria
  type: llm
  criteria: |-
    PASS only if ALL of the following hold; otherwise FAIL.

    1. It routes to docs/reference/incidents/<kebab>.md.
    2. The proposed postmortem has an Action items section as a table with Action, Type, Owner and Ticket (or equivalent) columns.
    3. {'It is blameless': 'it describes the missing-config deploy as a system/process gap and does not blame Sam by name as the cause.'}
    4. It does not invent owners or ticket numbers for action items; it asks or leaves them marked to fill in.
    5. It confirms the files before writing.
