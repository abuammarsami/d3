schema_version: '1.1'
name: prime-surfaces-business-rule
description: For a task that touches membership tiers and quotas, `prime` should discover the repo's taxonomy, load
  the root contract, and pull the ONE business rule and the active plan that govern the task — as a compact context
  pack, not by pasting whole files.
tags:
- prime
- context-economy
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  prompt: |-
    I'm about to add tier-based ad posting limits to this repo. Before I write any code,
    load the context I need from the docs so I get the rules right. Use /d3:prime if it's
    available.
  max_turns: 30
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
graders:
- name: criteria
  type: llm
  criteria: |-
    PASS only if ALL of the following hold; otherwise FAIL.

    1. It discovers the taxonomy from docs/README.md and loads the root CLAUDE.md.
    2. It surfaces docs/reference/business-rules/membership.md and states the load-bearing rule — that payment does not equal activation, and PerMonthTotalPost is the monthly quota.
    3. It surfaces the active plan docs/plans/ads/posting-limits/README.md.
    4. It returns a compact context pack that summarizes each loaded doc in roughly a line — it does NOT paste the full contents of the files.
