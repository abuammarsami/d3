schema_version: '1.1'
name: init-existing-report-only
description: A repo whose docs/README.md already carries a docs-check vocabulary block has its own docs system.
  /d3:init must report what is missing and must not scaffold over it.
tags:
- init
- safety
- existing-repo
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  prompt: /d3:init
  max_turns: 30
  timeout_seconds: 240
  allowed_tools:
  - Skill
  - Read
  - Glob
  - Grep
  - Bash
  - Write
  - Edit
graders:
- name: criteria
  type: llm
  criteria: |-
    PASS only if ALL of the following hold; otherwise FAIL.

    1. It recognizes that the repo already has a docs system (the vocabulary block in docs/README.md) and says it will not scaffold over it.
    2. It reports what is missing (for example AGENTS.md, a pull request template, document templates or a docs linter) rather than creating it.
    3. It does NOT create or modify docs/README.md or any other file.
